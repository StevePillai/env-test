<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger &amp; Compass — Expense Tracker &amp; Investment Planner</title>
<meta name="description" content="Track monthly expenses, understand your savings rate, and get educational guidance on where that money could go next." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- React (UMD, no build step required) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
/* ============================================================
   LEDGER & COMPASS — design tokens
   Palette: ink navy base, warm parchment surfaces in light mode,
   antique-gold accent, sage for gains, rust for spend.
   Type: Fraunces (display serif, financial-ledger feel) + Inter
   (UI/body) + JetBrains Mono (numbers/data).
   ============================================================ */
:root{
  --ink-950:#0b1220;
  --ink-900:#0f1a2b;
  --ink-800:#152238;
  --ink-700:#1d2f4a;
  --ink-600:#2b4468;
  --gold-500:#c9a24b;
  --gold-400:#dab868;
  --gold-100:#f4e8c9;
  --sage-500:#6fa287;
  --sage-300:#a9cdb9;
  --rust-500:#c1583b;
  --rust-300:#e0a793;
  --parchment-50:#faf8f2;
  --parchment-100:#f2ede0;
  --paper:#fffdf8;
  --ink-text:#1b2433;
  --muted-light:#6b7385;

  --bg:var(--ink-950);
  --surface:var(--ink-900);
  --surface-2:var(--ink-800);
  --surface-3:var(--ink-700);
  --border:rgba(201,162,75,0.18);
  --text:#eee8d8;
  --text-dim:#9fa8bd;
  --accent:var(--gold-500);
  --accent-strong:var(--gold-400);
  --positive:var(--sage-500);
  --negative:var(--rust-500);
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

[data-theme="light"]{
  --bg:var(--parchment-50);
  --surface:var(--paper);
  --surface-2:var(--parchment-100);
  --surface-3:#e8e0cc;
  --border:rgba(43,68,104,0.14);
  --text:var(--ink-text);
  --text-dim:#6b7385;
  --shadow: 0 10px 24px rgba(43,34,10,0.08);
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  transition:background .35s ease,color .35s ease;
  min-height:100vh;
}
::selection{ background:var(--accent); color:var(--ink-950); }
a{ color:inherit; }
button{ font-family:inherit; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:8px; }

/* focus visibility */
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ---------- layout shell ---------- */
#root{ min-height:100vh; }
.app-shell{
  display:grid;
  grid-template-columns:248px 1fr;
  min-height:100vh;
}
@media (max-width: 880px){
  .app-shell{ grid-template-columns:1fr; }
}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:28px 20px;
  display:flex;
  flex-direction:column;
  gap:28px;
  position:sticky;
  top:0;
  height:100vh;
}
@media (max-width: 880px){
  .sidebar{ position:relative; height:auto; border-right:none; border-bottom:1px solid var(--border); }
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-mark{
  width:38px; height:38px;
  border-radius:10px;
  background:linear-gradient(145deg, var(--gold-400), var(--gold-500));
  display:flex; align-items:center; justify-content:center;
  font-size:19px;
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(201,162,75,0.35);
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-text strong{ font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:0.01em; }
.brand-text span{ font-size:11px; color:var(--text-dim); }

nav.primary-nav{ display:flex; flex-direction:column; gap:4px; }
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  border:1px solid transparent;
  background:none;
  color:var(--text-dim);
  font-size:14px;
  font-weight:500;
  text-align:left;
  width:100%;
  transition:background .18s ease, color .18s ease, border-color .18s ease;
}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{
  background:var(--surface-2);
  color:var(--accent-strong);
  border-color:var(--border);
}
.nav-item .icon{ font-size:16px; width:18px; text-align:center; }

.sidebar-footer{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
.month-picker{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:8px 10px;
  font-family:var(--font-mono);
  font-size:12px;
}
.month-picker button{
  background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px;
}
.month-picker button:hover{ color:var(--accent-strong); background:var(--surface-3); }

.theme-toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:12px;
  color:var(--text-dim);
  background:var(--surface-2);
}
.switch{
  width:34px; height:19px; border-radius:20px;
  background:var(--surface-3);
  position:relative;
  cursor:pointer;
  border:1px solid var(--border);
  flex-shrink:0;
}
.switch .knob{
  position:absolute; top:1px; left:1px;
  width:15px; height:15px; border-radius:50%;
  background:var(--accent);
  transition:left .2s ease;
}
.switch.on .knob{ left:16px; }

/* ---------- main ---------- */
main.content{
  padding:32px 40px 80px;
  max-width:1180px;
  width:100%;
}
@media (max-width: 640px){
  main.content{ padding:20px 16px 60px; }
}

.page-header{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:16px; flex-wrap:wrap;
  margin-bottom:28px;
}
.page-header h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(26px,3.4vw,34px);
  margin:0 0 6px;
  letter-spacing:-0.01em;
}
.page-header p{ margin:0; color:var(--text-dim); font-size:14px; max-width:56ch; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  font-size:13.5px; font-weight:600;
  cursor:pointer;
  transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{ background:var(--surface-3); }
.btn:active{ transform:scale(0.97); }
.btn-accent{
  background:var(--accent);
  border-color:var(--accent);
  color:#20170a;
}
.btn-accent:hover{ background:var(--accent-strong); }
.btn-ghost{ background:none; }
.btn-danger{ color:var(--negative); border-color:rgba(193,88,59,0.35); background:none; }
.btn-danger:hover{ background:rgba(193,88,59,0.1); }
.btn-sm{ padding:6px 10px; font-size:12.5px; }

/* stat cards */
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-bottom:28px;
}
.stat-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  position:relative;
  overflow:hidden;
}
.stat-card .label{ font-size:12.5px; color:var(--text-dim); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.stat-card .value{
  font-family:var(--font-mono);
  font-size:26px;
  font-weight:500;
  letter-spacing:-0.01em;
}
.stat-card .sub{ margin-top:8px; font-size:12px; color:var(--text-dim); }
.stat-card .sub.up{ color:var(--positive); }
.stat-card .sub.down{ color:var(--negative); }
.stat-card.accented::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--gold-500),var(--gold-400));
}

/* panels */
.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:24px;
  margin-bottom:24px;
}
.panel-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:18px; gap:12px; flex-wrap:wrap;
}
.panel-head h2{
  font-family:var(--font-display);
  font-size:19px; font-weight:600; margin:0;
}
.panel-head p{ margin:4px 0 0; font-size:12.5px; color:var(--text-dim); }

.two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:24px; align-items:start; }
@media (max-width: 900px){ .two-col{ grid-template-columns:1fr; } }

/* forms */
.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
label.field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-dim); }
input, select{
  font-family:var(--font-body);
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:9px 11px;
  border-radius:var(--radius-sm);
  font-size:13.5px;
  width:100%;
}
input:focus, select:focus{ border-color:var(--accent); }
input[type="checkbox"]{ width:auto; accent-color:var(--accent); }
.checkbox-field{ flex-direction:row; align-items:center; gap:8px; }

/* table */
table.ledger{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.ledger th{
  text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em;
  color:var(--text-dim); font-weight:600;
  padding:8px 10px; border-bottom:1px solid var(--border);
}
table.ledger td{ padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.ledger tr:last-child td{ border-bottom:none; }
table.ledger tr:hover td{ background:var(--surface-2); }
.cat-pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:3px 9px; border-radius:20px;
  font-size:11.5px; font-weight:600;
  border:1px solid var(--border);
}
.cat-pill .dot{ width:7px; height:7px; border-radius:50%; }
.amount{ font-family:var(--font-mono); }
.amount.neg{ color:var(--negative); }
.amount.pos{ color:var(--positive); }
.row-actions{ display:flex; gap:6px; justify-content:flex-end; }
.icon-btn{
  background:none; border:none; color:var(--text-dim); cursor:pointer; padding:4px 6px; border-radius:4px; font-size:13px;
}
.icon-btn:hover{ color:var(--negative); background:var(--surface-3); }

/* budgets */
.budget-row{ margin-bottom:16px; }
.budget-row:last-child{ margin-bottom:0; }
.budget-row .meta{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; }
.budget-row .meta .name{ font-weight:600; }
.budget-row .meta .figures{ color:var(--text-dim); font-family:var(--font-mono); font-size:12px; }
.bar-track{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
.bar-fill{ height:100%; border-radius:6px; transition:width .4s ease; }

/* chart canvases */
.chart-wrap{ position:relative; height:260px; }
.chart-wrap.sm{ height:200px; }

/* empty state */
.empty-state{
  text-align:center; padding:40px 20px; color:var(--text-dim);
}
.empty-state .glyph{ font-size:30px; margin-bottom:10px; }
.empty-state p{ margin:0; font-size:13.5px; }

/* tags/badges for risk levels */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700;
  letter-spacing:0.02em;
}
.badge.conservative{ background:rgba(111,162,135,0.15); color:var(--positive); }
.badge.balanced{ background:rgba(201,162,75,0.15); color:var(--accent-strong); }
.badge.aggressive{ background:rgba(193,88,59,0.15); color:var(--negative); }

/* allocation bars (investment) */
.alloc-list{ display:flex; flex-direction:column; gap:14px; }
.alloc-item .top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
.alloc-item .top .name{ font-weight:600; display:flex; align-items:center; gap:8px; }
.alloc-item .top .figs{ font-family:var(--font-mono); color:var(--text-dim); }
.alloc-item .desc{ font-size:12px; color:var(--text-dim); margin-top:5px; line-height:1.5; }

.callout{
  border:1px solid var(--border);
  border-left:3px solid var(--accent);
  background:var(--surface-2);
  border-radius:var(--radius-sm);
  padding:14px 16px;
  font-size:12.8px;
  color:var(--text-dim);
  line-height:1.6;
}
.callout strong{ color:var(--text); }

/* idea cards for making money */
.idea-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.idea-card{
  border:1px solid var(--border);
  background:var(--surface-2);
  border-radius:var(--radius-md);
  padding:16px 18px;
}
.idea-card .glyph{ font-size:20px; margin-bottom:8px; display:block; }
.idea-card h4{ margin:0 0 6px; font-size:14px; font-family:var(--font-display); font-weight:600; }
.idea-card p{ margin:0; font-size:12.3px; color:var(--text-dim); line-height:1.55; }
.idea-card .effort{ margin-top:10px; font-size:11px; color:var(--accent-strong); font-weight:600; }

/* settings */
.settings-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }

/* toast */
.toast{
  position:fixed; bottom:22px; right:22px;
  background:var(--ink-900); color:var(--gold-100);
  border:1px solid var(--gold-500);
  padding:12px 18px; border-radius:var(--radius-sm);
  font-size:13px; box-shadow:var(--shadow);
  z-index:999;
  animation:toastIn .25s ease;
}
[data-theme="light"] .toast{ background:var(--ink-900); color:var(--gold-100); }
@keyframes toastIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}

.slider-row{ display:flex; align-items:center; gap:12px; }
input[type="range"]{ accent-color:var(--accent); flex:1; }

.footer-note{
  margin-top:36px; padding-top:18px; border-top:1px solid var(--border);
  font-size:11.5px; color:var(--text-dim); line-height:1.6;
}

.tab-pills{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.tab-pill{
  padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); cursor:pointer;
}
.tab-pill.active{ background:var(--accent); border-color:var(--accent); color:#20170a; }
</style>
</head>
<body data-theme="dark">
<div id="root"></div>

<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================
   CONSTANTS
   ========================================================= */
const CATEGORIES = [
  { id: "housing",       label: "Housing & Rent",   color: "#c9a24b" },
  { id: "food",          label: "Food & Groceries", color: "#6fa287" },
  { id: "transport",     label: "Transport",        color: "#5b8fbf" },
  { id: "utilities",     label: "Utilities",        color: "#a58bd6" },
  { id: "health",        label: "Health",           color: "#c1583b" },
  { id: "entertainment", label: "Entertainment",    color: "#d68fb0" },
  { id: "shopping",      label: "Shopping",         color: "#e0a743" },
  { id: "education",     label: "Education",        color: "#4fb0c6" },
  { id: "debt",          label: "Debt/EMI",         color: "#b25c8a" },
  { id: "other",         label: "Other",            color: "#8a94a6" },
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));

const CURRENCIES = {
  INR: { symbol: "₹", locale: "en-IN" },
  USD: { symbol: "$", locale: "en-US" },
  EUR: { symbol: "€", locale: "de-DE" },
  GBP: { symbol: "£", locale: "en-GB" },
};

const STORAGE_KEY = "ledgerCompass.v1";

const MONTH_FMT = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
};
const todayYM = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const shiftYM = (ym, delta) => {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* =========================================================
   PERSISTENCE
   ========================================================= */
const DEFAULT_STATE = {
  incomes: [],
  expenses: [],
  budgets: {},
  settings: {
    theme: "dark",
    currency: "INR",
    age: 28,
    riskProfile: "balanced",
    hasEmergencyFund: false,
    emergencyFundMonths: 0,
    dependents: 0,
  },
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredCloneSafe(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return { ...structuredCloneSafe(DEFAULT_STATE), ...parsed, settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) } };
  } catch (e) {
    console.warn("Could not read saved data, starting fresh.", e);
    return structuredCloneSafe(DEFAULT_STATE);
  }
}
function structuredCloneSafe(obj) { return JSON.parse(JSON.stringify(obj)); }
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn("Could not save data — storage may be full or blocked.", e); }
}

/* =========================================================
   FORMATTERS
   ========================================================= */
function useFormatter(currencyCode) {
  return useMemo(() => {
    const cfg = CURRENCIES[currencyCode] || CURRENCIES.INR;
    const nf = new Intl.NumberFormat(cfg.locale, { maximumFractionDigits: 0 });
    return {
      symbol: cfg.symbol,
      fmt: (n) => `${cfg.symbol}${nf.format(Math.round(n || 0))}`,
      fmtSigned: (n) => `${n < 0 ? "−" : "+"}${cfg.symbol}${nf.format(Math.abs(Math.round(n || 0)))}`,
    };
  }, [currencyCode]);
}

/* =========================================================
   INVESTMENT / ALLOCATION ENGINE
   Purely educational heuristics — not personalized financial
   advice. Based on widely-cited rules of thumb:
     - Emergency fund before investing (3–6 months expenses)
     - Equity allocation ≈ (100 − age), nudged by risk profile
     - Remainder split across debt/fixed-income, gold, retirement
   ========================================================= */
function buildAllocationPlan({ monthlySavings, age, riskProfile, hasEmergencyFund, emergencyFundMonths, monthlyExpenses, dependents }) {
  if (monthlySavings <= 0) {
    return { stage: "no-surplus", buckets: [] };
  }

  // Stage 1: emergency fund not yet adequate
  const targetMonths = dependents > 0 ? 6 : 4;
  if (!hasEmergencyFund || emergencyFundMonths < targetMonths) {
    const remainingMonths = Math.max(targetMonths - (emergencyFundMonths || 0), 1);
    const emergencyPortion = Math.min(monthlySavings, monthlyExpenses > 0 ? monthlyExpenses * 0.6 : monthlySavings * 0.6);
    const rest = monthlySavings - emergencyPortion;
    const buckets = [
      {
        name: "Emergency fund",
        pct: Math.round((emergencyPortion / monthlySavings) * 100),
        amount: emergencyPortion,
        desc: `Keep building toward ${targetMonths} months of expenses in a liquid, easily-accessible account (e.g. a high-interest savings account or liquid fund) before taking on market risk. You still have about ${remainingMonths} month(s) of buffer to build.`,
        color: "#6fa287",
      },
    ];
    if (rest > 0) {
      buckets.push({
        name: "Low-risk parking (short-term FD / liquid fund)",
        pct: Math.round((rest / monthlySavings) * 100),
        amount: rest,
        desc: "While the emergency fund is incomplete, keep any extra surplus somewhere low-volatility rather than in equities.",
        color: "#5b8fbf",
      });
    }
    return { stage: "building-emergency-fund", buckets };
  }

  // Stage 2: emergency fund in place — allocate the rest
  let equityBase = 100 - age; // classic rule of thumb
  const riskAdj = { conservative: -15, balanced: 0, aggressive: 15 }[riskProfile] ?? 0;
  let equityPct = Math.min(85, Math.max(15, equityBase + riskAdj));
  let debtPct = Math.min(70, Math.max(10, 100 - equityPct - 15));
  let goldPct = 10;
  let retirementPct = 100 - equityPct - debtPct - goldPct;
  if (retirementPct < 5) { retirementPct = 5; debtPct = 100 - equityPct - goldPct - retirementPct; }

  const total = equityPct + debtPct + goldPct + retirementPct;
  const norm = (v) => Math.round((v / total) * 100);
  equityPct = norm(equityPct); debtPct = norm(debtPct); goldPct = norm(goldPct);
  retirementPct = 100 - equityPct - debtPct - goldPct;

  const buckets = [
    {
      name: "Equity / index funds",
      pct: equityPct,
      amount: monthlySavings * (equityPct / 100),
      desc: "Broad-market index funds or diversified equity mutual funds via a monthly SIP, for long-term growth. Higher volatility, longer horizon needed (5+ years ideally).",
      color: "#c9a24b",
    },
    {
      name: "Debt / fixed income",
      pct: debtPct,
      amount: monthlySavings * (debtPct / 100),
      desc: "Bonds, debt mutual funds, or fixed deposits for stability and to balance out equity swings.",
      color: "#5b8fbf",
    },
    {
      name: "Gold / commodities",
      pct: goldPct,
      amount: monthlySavings * (goldPct / 100),
      desc: "A small allocation (gold ETF or sovereign gold bonds) as a hedge against inflation and market shocks.",
      color: "#d68fb0",
    },
    {
      name: "Retirement accounts",
      pct: retirementPct,
      amount: monthlySavings * (retirementPct / 100),
      desc: "Tax-advantaged retirement vehicles (e.g. EPF/PPF/NPS, 401(k)/IRA, or your country's equivalent) — often worth maxing employer-matched contributions first.",
      color: "#4fb0c6",
    },
  ].filter(b => b.pct > 0);

  return { stage: "invest", buckets, equityPct, riskAdj };
}

/* =========================================================

   ========================================================= */
function Icon({ children }) { return <span className="icon" aria-hidden="true">{children}</span>; }

function StatCard({ label, value, sub, subDirection, accented, icon }) {
  return (
    <div className={`stat-card${accented ? " accented" : ""}`}>
      <div className="label"><Icon>{icon}</Icon>{label}</div>
      <div className="value">{value}</div>
      {sub && <div className={`sub${subDirection ? " " + subDirection : ""}`}>{sub}</div>}
    </div>
  );
}

function CatPill({ catId }) {
  const cat = CAT_MAP[catId] || CAT_MAP.other;
  return (
    <span className="cat-pill" style={{ color: cat.color, borderColor: cat.color + "55" }}>
      <span className="dot" style={{ background: cat.color }}></span>{cat.label}
    </span>
  );
}

function Toast({ message, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2200);
    return () => clearTimeout(t);
  }, [message]);
  if (!message) return null;
  return <div className="toast">{message}</div>;
}

/* =========================================================
   CHART COMPONENTS (thin Chart.js wrappers)
   ========================================================= */
function DoughnutChart({ data, labels, colors, formatter }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const textColor = getComputedStyle(document.body).getPropertyValue("--text").trim() || "#eee8d8";
    chartRef.current = new Chart(ref.current, {
      type: "doughnut",
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: getComputedStyle(document.body).getPropertyValue("--surface").trim() }],
      },
      options: {
        maintainAspectRatio: false,
        cutout: "62%",
        plugins: {
          legend: { position: "bottom", labels: { color: textColor, boxWidth: 10, font: { size: 11 }, padding: 12 } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${formatter.fmt(ctx.raw)}` } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(data), JSON.stringify(labels), document.body.getAttribute("data-theme")]);

  return <div className="chart-wrap"><canvas ref={ref}></canvas></div>;
}

function TrendChart({ months, income, expense, formatter }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const textColor = getComputedStyle(document.body).getPropertyValue("--text-dim").trim() || "#9fa8bd";
    const gridColor = getComputedStyle(document.body).getPropertyValue("--border").trim() || "rgba(255,255,255,0.08)";
    chartRef.current = new Chart(ref.current, {
      type: "bar",
      data: {
        labels: months.map(m => MONTH_FMT(m).split(" ")[0].slice(0, 3)),
        datasets: [
          { label: "Income", data: income, backgroundColor: "#6fa287", borderRadius: 4, maxBarThickness: 22 },
          { label: "Expenses", data: expense, backgroundColor: "#c1583b", borderRadius: 4, maxBarThickness: 22 },
        ],
      },
      options: {
        maintainAspectRatio: false,
        scales: {
          x: { ticks: { color: textColor, font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: textColor, font: { size: 10 }, callback: (v) => formatter.symbol + v }, grid: { color: gridColor } },
        },
        plugins: {
          legend: { position: "bottom", labels: { color: textColor, boxWidth: 10, font: { size: 11 } } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${formatter.fmt(ctx.raw)}` } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [JSON.stringify(months), JSON.stringify(income), JSON.stringify(expense), document.body.getAttribute("data-theme")]);

  return <div className="chart-wrap"><canvas ref={ref}></canvas></div>;
}

/* =========================================================
   PAGE: OVERVIEW
   ========================================================= */
function OverviewPage({ state, ym, fmt }) {
  const monthIncomes = state.incomes.filter(i => i.month === ym);
  const monthExpenses = state.expenses.filter(e => e.month === ym);
  const totalIncome = monthIncomes.reduce((s, i) => s + Number(i.amount || 0), 0);
  const totalExpense = monthExpenses.reduce((s, e) => s + Number(e.amount || 0), 0);
  const savings = totalIncome - totalExpense;
  const savingsRate = totalIncome > 0 ? (savings / totalIncome) * 100 : 0;

  const prevYM = shiftYM(ym, -1);
  const prevExpense = state.expenses.filter(e => e.month === prevYM).reduce((s, e) => s + Number(e.amount || 0), 0);
  const expenseDelta = prevExpense > 0 ? ((totalExpense - prevExpense) / prevExpense) * 100 : null;

  const byCategory = useMemo(() => {
    const map = {};
    monthExpenses.forEach(e => { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }, [monthExpenses]);

  const last6 = useMemo(() => {
    const arr = [];
    for (let i = 5; i >= 0; i--) arr.push(shiftYM(ym, -i));
    return arr;
  }, [ym]);
  const incomeSeries = last6.map(m => state.incomes.filter(i => i.month === m).reduce((s, i) => s + Number(i.amount || 0), 0));
  const expenseSeries = last6.map(m => state.expenses.filter(e => e.month === m).reduce((s, e) => s + Number(e.amount || 0), 0));

  return (
    <React.Fragment>
      <div className="stat-grid">
        <StatCard label="Income this month" icon="↗" value={fmt.fmt(totalIncome)} />
        <StatCard label="Spent this month" icon="↘" value={fmt.fmt(totalExpense)}
          sub={expenseDelta !== null ? `${expenseDelta >= 0 ? "+" : ""}${expenseDelta.toFixed(1)}% vs last month` : null}
          subDirection={expenseDelta === null ? null : (expenseDelta > 0 ? "down" : "up")} />
        <StatCard label="Saved this month" icon="✓" value={fmt.fmt(savings)}
          sub={totalIncome > 0 ? `${savingsRate.toFixed(1)}% savings rate` : "Add income to see your rate"}
          subDirection={savings >= 0 ? "up" : "down"} accented />
        <StatCard label="Categories tracked" icon="▤" value={byCategory.length}
          sub={byCategory[0] ? `Top: ${CAT_MAP[byCategory[0][0]]?.label || byCategory[0][0]}` : "No expenses yet"} />
      </div>

      <div className="two-col">
        <div className="panel">
          <div className="panel-head">
            <div>
              <h2>Six-month trend</h2>
              <p>Income vs. expenses, so you can see the pattern rather than one month in isolation.</p>
            </div>
          </div>
          <TrendChart months={last6} income={incomeSeries} expense={expenseSeries} formatter={fmt} />
        </div>

        <div className="panel">
          <div className="panel-head">
            <div>
              <h2>Where it went</h2>
              <p>{MONTH_FMT(ym)}</p>
            </div>
          </div>
          {byCategory.length === 0 ? (
            <div className="empty-state">
              <div className="glyph">🗒️</div>
              <p>No expenses logged for this month yet.</p>
            </div>
          ) : (
            <DoughnutChart
              data={byCategory.map(([, v]) => v)}
              labels={byCategory.map(([k]) => CAT_MAP[k]?.label || k)}
              colors={byCategory.map(([k]) => CAT_MAP[k]?.color || "#8a94a6")}
              formatter={fmt}
            />
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

function ExpensesPage({ state, setState, ym, fmt, notify }) {

  useEffect(() => { setForm(f => ({ ...f, date: `${ym}-01` })); }, [ym]);

  const monthExpenses = state.expenses
    .filter(e => e.month === ym)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  function addExpense(e) {
    e.preventDefault();
    if (!form.name.trim() || !form.amount || Number(form.amount) <= 0) {
      notify("Give the expense a name and an amount above zero.");
      return;
    }
    const entry = {
      id: uid(),
      name: form.name.trim(),
      amount: Number(form.amount),
      category: form.category,
      date: form.date || `${ym}-01`,
      month: (form.date || `${ym}-01`).slice(0, 7),
      recurring: form.recurring,
    };
    setState(s => ({ ...s, expenses: [...s.expenses, entry] }));
    setForm({ name: "", amount: "", category: form.category, date: form.date, recurring: false });
    notify("Expense added.");
  }

  function removeExpense(id) {
    setState(s => ({ ...s, expenses: s.expenses.filter(e => e.id !== id) }));

    const nextMonth = shiftYM(ym, 1);

    notify(`Copied "${entry.name}" into ${MONTH_FMT(nextMonth)}.`);

    <React.Fragment>
      <div className="panel">
        <div className="panel-head">
          <div>
            <h2>Log an expense</h2>

                onChange={e => setForm({ ...form, amount: e.target.value })} />
            </label>
            <label className="field">Category
              <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>
                {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </label>
            <label className="field">Date
              <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
            </label>
            <label className="field checkbox-field" style={{ justifyContent: "flex-end" }}>
              <input type="checkbox" checked={form.recurring} onChange={e => setForm({ ...form, recurring: e.target.checked })} />
              Recurring monthly

          </div>
          <div style={{ marginTop: 14 }}>
            <button type="submit" className="btn btn-accent">+ Add expense</button>
          </div>
        </form>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div>
            <h2>{MONTH_FMT(ym)}</h2>
            <p>{monthExpenses.length} expense{monthExpenses.length === 1 ? "" : "s"} logged</p>
          </div>
        </div>
        {monthExpenses.length === 0 ? (
          <div className="empty-state">
            <div className="glyph">🧾</div>
            <p>Nothing logged for this month yet — add your first expense above.</p>
          </div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table className="ledger">
              <thead>
                <tr><th>Date</th><th>Name</th><th>Category</th><th style={{ textAlign: "right" }}>Amount</th><th></th></tr>
              </thead>
              <tbody>
                {monthExpenses.map(e => (
                  <tr key={e.id}>
                    <td>{e.date}</td>
                    <td>{e.name}{e.recurring && <span title="Recurring" style={{ marginLeft: 6, opacity: 0.6 }}>↻</span>}</td>
                    <td><CatPill catId={e.category} /></td>
                    <td style={{ textAlign: "right" }} className="amount neg">−{fmt.fmt(e.amount)}</td>
                    <td>
                      <div className="row-actions">
                        {e.recurring && <button className="icon-btn" title="Copy to next month" onClick={() => addRecurringToNextMonth(e)}>⇥</button>}
                        <button className="icon-btn" title="Delete" onClick={() => removeExpense(e.id)}>✕</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

function InvestPage({ state, setState, ym, fmt, notify }) {
  const { settings } = state;
  const monthIncome = state.incomes.filter(i => i.month === ym).reduce((s, i) => s + Number(i.amount || 0), 0);
  const monthExpense = state.expenses.filter(e => e.month === ym).reduce((s, e) => s + Number(e.amount || 0), 0);

  // Use trailing 3-month average where possible for a steadier picture
  const trailing = [0, 1, 2].map(i => shiftYM(ym, -i));
  const avgIncome = trailing.reduce((s, m) => s + state.incomes.filter(i => i.month === m).reduce((a, i) => a + Number(i.amount || 0), 0), 0) / 3;
  const avgExpense = trailing.reduce((s, m) => s + state.expenses.filter(e => e.month === m).reduce((a, e) => a + Number(e.amount || 0), 0), 0) / 3;
  const monthlySavings = Math.max(0, (avgIncome || monthIncome) - (avgExpense || monthExpense));

  const plan = useMemo(() => buildAllocationPlan({
    monthlySavings,
    age: settings.age,
    riskProfile: settings.riskProfile,
    hasEmergencyFund: settings.hasEmergencyFund,
    emergencyFundMonths: settings.emergencyFundMonths,
    monthlyExpenses: avgExpense || monthExpense,
    dependents: settings.dependents,
  }), [monthlySavings, settings, avgExpense, monthExpense]);

  function updateSetting(key, value) {
    setState(s => ({ ...s, settings: { ...s.settings, [key]: value } }));
  }

  return (
    <React.Fragment>
      <div className="panel">
        <div className="panel-head">
          <div>
            <h2>Your profile</h2>
            <p>These inputs shape the suggestions below — nothing here is sent anywhere, it's stored on this device only.</p>
          </div>
        </div>
        <div className="settings-grid">
          <label className="field">Age
            <input type="number" min="16" max="90" value={settings.age} onChange={e => updateSetting("age", Number(e.target.value) || 0)} />
          </label>
          <label className="field">Risk appetite
            <select value={settings.riskProfile} onChange={e => updateSetting("riskProfile", e.target.value)}>
              <option value="conservative">Conservative</option>
              <option value="balanced">Balanced</option>
              <option value="aggressive">Aggressive</option>
            </select>
          </label>
          <label className="field">Dependents relying on your income
            <input type="number" min="0" max="10" value={settings.dependents} onChange={e => updateSetting("dependents", Number(e.target.value) || 0)} />
          </label>
          <label className="field checkbox-field" style={{ alignSelf: "end" }}>
            <input type="checkbox" checked={settings.hasEmergencyFund} onChange={e => updateSetting("hasEmergencyFund", e.target.checked)} />
            I already have an emergency fund
          </label>
          {settings.hasEmergencyFund && (
            <label className="field">Months of expenses it covers
              <input type="number" min="0" max="24" value={settings.emergencyFundMonths} onChange={e => updateSetting("emergencyFundMonths", Number(e.target.value) || 0)} />
            </label>
          )}
        </div>
      </div>

      <div className="two-col">
        <div className="panel">
          <div className="panel-head">
            <div>
              <h2>Suggested monthly allocation</h2>
              <p>Based on a ~3-month average surplus of {fmt.fmt(monthlySavings)}/month</p>
            </div>
            <span className={`badge ${settings.riskProfile}`}>{settings.riskProfile}</span>
          </div>

          {plan.stage === "no-surplus" ? (
            <div className="empty-state">
              <div className="glyph">⚖️</div>
              <p>Your logged expenses meet or exceed your income right now, so there's no surplus to allocate yet. Trimming a recurring cost or adding income is the first move — see ideas below.</p>
            </div>
          ) : (
            <div className="alloc-list">
              {plan.buckets.map(b => (
                <div className="alloc-item" key={b.name}>
                  <div className="top">
                    <span className="name"><span style={{ width: 9, height: 9, borderRadius: "50%", background: b.color || "var(--accent)", display: "inline-block" }}></span>{b.name}</span>
                    <span className="figs">{b.pct}% · {fmt.fmt(b.amount)}</span>
                  </div>
                  <div className="bar-track"><div className="bar-fill" style={{ width: `${b.pct}%`, background: b.color || "var(--accent)" }}></div></div>
                  <div className="desc">{b.desc}</div>
                </div>
              ))}
            </div>
          )}

          <div className="callout" style={{ marginTop: 18 }}>
            <strong>This is educational, not personalized financial advice.</strong> The split above comes from common rules of thumb (like allocating roughly "100 minus your age" to equities), not from your full financial picture. Consider talking to a licensed financial advisor before making investment decisions, and never invest money you might need on short notice.
          </div>
        </div>

        <div className="panel">
          <div className="panel-head"><div><h2>How this was calculated</h2></div></div>
          <div className="callout" style={{ marginBottom: 14 }}>
            Average of your last 3 months' income and expenses (falling back to this month if history is short) gives a steadier "typical surplus" than a single month.
          </div>
          <table className="ledger">
            <tbody>
              <tr><td>Avg. monthly income</td><td style={{ textAlign: "right" }} className="amount pos">{fmt.fmt(avgIncome || monthIncome)}</td></tr>
              <tr><td>Avg. monthly expenses</td><td style={{ textAlign: "right" }} className="amount neg">{fmt.fmt(avgExpense || monthExpense)}</td></tr>
              <tr><td><strong>Typical monthly surplus</strong></td><td style={{ textAlign: "right" }} className="amount pos"><strong>{fmt.fmt(monthlySavings)}</strong></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div>
            <h2>If you want more to work with</h2>
            <p>General, low-risk ways people commonly increase their monthly surplus — pick what fits your situation.</p>
          </div>
        </div>
        <div className="idea-grid">
          {MONEY_IDEAS.map(idea => (
            <div className="idea-card" key={idea.title}>
              <span className="glyph">{idea.glyph}</span>
              <h4>{idea.title}</h4>
              <p>{idea.body}</p>
              <div className="effort">{idea.effort}</div>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}

/* =========================================================
   PAGE: SETTINGS
   ========================================================= */
function SettingsPage({ state, setState, notify }) {
  const fileInputRef = useRef(null);

  function updateSetting(key, value) {
    setState(s => ({ ...s, settings: { ...s.settings, [key]: value } }));
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ledger-compass-backup-${todayYM()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    notify("Backup downloaded.");
  }

  function importData(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object") throw new Error("bad shape");
        setState({ ...structuredCloneSafe(DEFAULT_STATE), ...parsed, settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) } });
        notify("Data imported.");
      } catch (err) {
        notify("That file doesn't look like a valid backup.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function clearAll() {
    if (window.confirm("This clears every expense, income entry, and budget on this device. This can't be undone — continue?")) {
      setState(structuredCloneSafe(DEFAULT_STATE));
      notify("All data cleared.");
    }
  }

  return (
    <div className="panel">
      <div className="panel-head"><div><h2>Settings &amp; data</h2><p>Everything lives in this browser's local storage — nothing is sent to a server.</p></div></div>
      <div className="settings-grid" style={{ marginBottom: 22 }}>
        <label className="field">Currency
          <select value={state.settings.currency} onChange={e => updateSetting("currency", e.target.value)}>
            {Object.keys(CURRENCIES).map(c => <option key={c} value={c}>{c} ({CURRENCIES[c].symbol})</option>)}
          </select>
        </label>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button className="btn" onClick={exportData}>⭳ Export backup (.json)</button>
        <button className="btn" onClick={() => fileInputRef.current && fileInputRef.current.click()}>⭱ Import backup</button>
        <input type="file" accept="application/json" ref={fileInputRef} onChange={importData} style={{ display: "none" }} />
        <button className="btn btn-danger" onClick={clearAll}>Clear all data</button>
      </div>
      <div className="footer-note">
        Ledger &amp; Compass stores everything locally on this device via <code>localStorage</code>. Clearing your browser data, using a different browser, or a different device will not carry your numbers over — use "Export backup" regularly if you'd like a copy.
      </div>
    </div>
  );
}

/* =========================================================
   ROOT APP
   ========================================================= */
function App() {
  const [state, setState] = useState(loadState);
  const [page, setPage] = useState("overview");
  const [ym, setYm] = useState(todayYM());
  const [toastMsg, setToastMsg] = useState("");
  const [sidebarTheme, setSidebarTheme] = useState(state.settings.theme || "dark");

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => {
    document.body.setAttribute("data-theme", state.settings.theme || "dark");
    setSidebarTheme(state.settings.theme || "dark");
  }, [state.settings.theme]);

  const fmt = useFormatter(state.settings.currency);
  const notify = useCallback((msg) => setToastMsg(msg), []);

  function toggleTheme() {
    setState(s => ({ ...s, settings: { ...s.settings, theme: s.settings.theme === "light" ? "dark" : "light" } }));
  }

  const NAV = [
    { id: "overview", label: "Overview", icon: "◈" },
    { id: "expenses", label: "Expenses", icon: "▤" },
    { id: "income", label: "Income & budgets", icon: "◎" },
    { id: "invest", label: "Invest & grow", icon: "⌂" },
    { id: "settings", label: "Settings & data", icon: "⚙" },
  ];

  const PAGE_META = {
    overview: { title: "Overview", desc: "Your money, at a glance — how much came in, went out, and what's left over." },
    expenses: { title: "Expenses", desc: "Log what you spend and see it sorted by category." },
    income: { title: "Income & budgets", desc: "Track income sources and set soft caps per category." },
    invest: { title: "Invest & grow", desc: "Turn a monthly surplus into a plan, with educational context on where it could go." },
    settings: { title: "Settings & data", desc: "Currency, backups, and everything about how your data is stored." },
  };

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">🧭</div>
          <div className="brand-text">
            <strong>Ledger &amp; Compass</strong>
            <span>Personal finance, on your device</span>
          </div>
        </div>

        <nav className="primary-nav" aria-label="Main">
          {NAV.map(item => (
            <button key={item.id} className={`nav-item${page === item.id ? " active" : ""}`} onClick={() => setPage(item.id)}>
              <Icon>{item.icon}</Icon>{item.label}
            </button>
          ))}
        </nav>

        <div className="sidebar-footer">
          <div className="month-picker">
            <button onClick={() => setYm(shiftYM(ym, -1))} aria-label="Previous month">‹</button>
            <span>{MONTH_FMT(ym)}</span>
            <button onClick={() => setYm(shiftYM(ym, 1))} aria-label="Next month">›</button>
          </div>
          <div className="theme-toggle">
            <span>{sidebarTheme === "light" ? "Light" : "Dark"} mode</span>
            <div className={`switch${sidebarTheme === "light" ? " on" : ""}`} onClick={toggleTheme} role="switch" aria-checked={sidebarTheme === "light"} tabIndex="0"
              onKeyDown={e => { if (e.key === "Enter" || e.key === " ") toggleTheme(); }}>
              <div className="knob"></div>
            </div>
          </div>
        </div>
      </aside>

      <main className="content">
        <div className="page-header">
          <div>
            <h1>{PAGE_META[page].title}</h1>
            <p>{PAGE_META[page].desc}</p>
          </div>
        </div>

        {page === "overview" && <OverviewPage state={state} ym={ym} fmt={fmt} />}
        {page === "expenses" && <ExpensesPage state={state} setState={setState} ym={ym} fmt={fmt} notify={notify} />}
        {page === "income" && <IncomeBudgetPage state={state} setState={setState} ym={ym} fmt={fmt} notify={notify} />}
        {page === "invest" && <InvestPage state={state} setState={setState} ym={ym} fmt={fmt} notify={notify} />}
        {page === "settings" && <SettingsPage state={state} setState={setState} notify={notify} />}

        <div className="footer-note">
          Ledger &amp; Compass is a static, client-side app — your figures never leave this browser. Investment content is educational only and not a substitute for advice from a licensed professional.
        </div>
      </main>

      <Toast message={toastMsg} onDone={() => setToastMsg("")} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
